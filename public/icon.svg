<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="primaryGrad" x1="90" y1="130" x2="420" y2="382" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="230" y1="130" x2="420" y2="194" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="256" y1="0" x2="256" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#1D4ED8" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect x="12" y="12" width="488" height="488" rx="110" fill="#0B1120" stroke="#1E293B" stroke-width="6" />
  
  <!-- Subtle Ambient Glow -->
  <rect x="28" y="28" width="456" height="456" rx="98" stroke="url(#glowGrad)" stroke-width="8" />

  <!-- Center Monogram: MZ (Mohamed Zahran) -->
  <!-- Left Column of M -->
  <rect x="92" y="130" width="64" height="252" rx="22" fill="#60A5FA" />

  <!-- Center Diagonal of M -->
  <polygon points="140,140 240,260 240,325 140,205" fill="#3B82F6" />

  <!-- Top Bar of Z -->
  <rect x="230" y="130" width="190" height="64" rx="22" fill="url(#accentGrad)" />

  <!-- Diagonal of Z -->
  <polygon points="410,170 420,190 285,375 230,375 355,210" fill="#2563EB" />

  <!-- Bottom Bar of Z -->
  <rect x="230" y="318" width="190" height="64" rx="22" fill="#60A5FA" />

  <!-- Accent Calligraphic Diamond -->
  <polygon points="256,75 280,99 256,123 232,99" fill="#38BDF8" />
</svg>